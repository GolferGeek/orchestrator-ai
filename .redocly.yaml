# See https://redocly.com/docs/cli/configuration/ for more information.

# Defines which APIs to lint, bundle, etc. 
# If you have a single API definition, you can often omit this and pass the file path on the command line.
# apis:
#   main: apps/api/v2/shared/contracts/a2a-protocol.yaml

# Extend a recommended ruleset
extends:
  - recommended

# Configure specific rules
rules:
  # For component libraries, 'paths' and 'servers' might not be present.
  # The 'struct' rule (formerly 'spec') checks the overall OpenAPI structure.
  # We will keep it as an error for now. If these files are purely libraries,
  # they should ideally be bundled into a root document that *does* have paths and servers.
  struct: error 
  no-empty-servers: error

  # Warnings we want to suppress for our component libraries:
  no-unused-components: off
  info-license: off

# You can define custom plugins or rulesets here.
# plugins:
#   - './my-custom-plugin.js'

# You can define custom decorators here.
# decorators:
#   custom-decorator:
#     rule: 'InfoDescription'
#     message: 'This is a custom message for InfoDescription decorator' 