# Travel Planner External A2A Agent Configuration
name: "Travel Planner A2A Agent"
description: "Advanced travel planning agent with multi-agent coordination capabilities"
version: "1.0.0"
type: "external"

# External A2A configuration
external_a2a_configuration:
  # Remote agent endpoint (placeholder - replace with actual endpoint when available)
  endpoint: "${TRAVEL_PLANNER_ENDPOINT:-https://travel-planner-agent.example.com}"
  protocol: "A2A"
  
  # Connection settings
  timeout: 60000  # 60 seconds (longer for complex travel planning)
  
  # Authentication configuration
  authentication:
    type: "api_key"
    header: "X-API-Key"
    value: "${TRAVEL_PLANNER_API_KEY}"
  
  # Retry configuration
  retry:
    attempts: 3
    delay: 2000      # 2 second base delay
    backoff: "exponential"
  
  # Expected capabilities (will be overridden by actual agent discovery)
  expected_capabilities:
    - "flight_search"
    - "hotel_search"
    - "weather_forecast"
    - "itinerary_planning"
    - "multi_agent_coordination"
    - "travel_recommendations"
  
  # Health check configuration
  health_check:
    enabled: true
    interval: 600000  # 10 minutes
    endpoint: "/.well-known/agent.json"
  
  # Required environment variables for the external agent
  required_env_vars:
    - "TRAVEL_PLANNER_ENDPOINT"
    - "TRAVEL_PLANNER_API_KEY"
    - "OPENWEATHER_API_KEY"
    - "BRAVE_SEARCH_API_KEY"

# Metadata for local registration
metadata:
  category: "external"
  provider: "Custom"
  tags: ["travel", "planning", "multi-agent", "coordination", "a2a-protocol"]
  
  # Local override settings
  local_settings:
    log_level: "info"
    enable_metrics: true
    enable_evaluation: true
    enable_caching: true  # Enable response caching for travel data
    cache_ttl: 3600       # 1 hour cache for travel data
  
  # Agent-specific metadata
  agent_metadata:
    supported_destinations: ["worldwide"]
    supported_languages: ["en", "es", "fr", "de"]
    max_itinerary_days: 30
    supports_group_travel: true
    supports_business_travel: true 