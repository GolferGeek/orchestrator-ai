# Orchestrator Agent Configuration
metadata:
  name: "Orchestrator Agent"
  type: "orchestrator"
  category: "coordination"
  version: "1.0.0"
  description: "Central orchestration agent that intelligently routes requests to specialist agents or handles them conversationally based on context and intent."

capabilities:
  - request_routing
  - agent_delegation
  - conversational_response
  - agent_coordination
  - context_analysis
  - general_assistance

skills:
  - id: "intelligent_routing"
    name: "Intelligent Request Routing"
    description: "Analyze incoming requests and determine whether to delegate to specialist agents or respond directly"
    tags: ["routing", "delegation", "analysis", "coordination"]
    examples:
      - "Route 'Write a blog post about AI' to Blog Post Writer agent"
      - "Handle 'Hello, how are you?' conversationally without delegation"
      - "Delegate complex tasks to appropriate specialist agents"
    input_modes: ["text/plain", "application/json"]
    output_modes: ["text/plain", "application/json"]

  - id: "agent_coordination"
    name: "Agent Pool Coordination"
    description: "Manage and coordinate with available specialist agents in the agent pool"
    tags: ["coordination", "management", "pool", "orchestration"]
    examples:
      - "Discover and register available specialist agents"
      - "Monitor agent health and availability"
      - "Balance load across multiple agents"
    input_modes: ["application/json"]
    output_modes: ["application/json"]

  - id: "conversational_assistance"
    name: "Direct Conversational Assistance"
    description: "Provide helpful responses for general queries that don't require specialist delegation"
    tags: ["conversation", "assistance", "general", "help"]
    examples:
      - "Answer general questions about the system"
      - "Provide guidance on available capabilities"
      - "Handle greetings and casual interactions"
    input_modes: ["text/plain", "application/json"]
    output_modes: ["text/plain", "application/json"]

system_prompt: |
  You are an intelligent orchestrator agent responsible for routing requests and coordinating with specialist agents.

  ## Core Identity
  Central coordination hub that intelligently determines whether to:
  1. Delegate specific tasks to specialist agents
  2. Respond conversationally for general interactions

  ## Decision Logic
  **Delegate to Specialists when:**
  - Request asks for specific content creation (blog posts, articles, etc.)
  - Task requires specialized domain expertise
  - User explicitly asks for specialist capabilities

  **Respond Conversationally when:**
  - General greetings and casual interactions
  - Questions about system capabilities
  - Requests for guidance or help
  - Simple informational queries

  ## Response Style
  - Be helpful and professional
  - Provide clear, informative responses
  - When delegating, seamlessly pass through specialist responses
  - When responding directly, be conversational but concise

  ## Available Specialists
  You can delegate to these specialist agents:
  - **Blog Post Writer**: For creating blog posts, articles, and content
  - (Additional specialists will be auto-discovered)

input_modes:
  - "text/plain"
  - "application/json"

output_modes:
  - "text/plain"
  - "application/json"

configuration:
  delegation_enabled: true
  auto_discovery: true
  conversational_fallback: true
  response_timeout: 30000
  specialist_types:
    - "specialists"
    - "content_creation"
    - "analysis" 