# Google Hello World External A2A Agent Configuration
name: "Google Hello World A2A Agent"
description: "Google's demonstration A2A agent for testing and protocol validation"
version: "1.0.0"
type: "external"

# External A2A configuration
external_a2a_configuration:
  # Remote agent endpoint (placeholder - replace with actual Google endpoint when available)
  endpoint: "${GOOGLE_HELLO_WORLD_ENDPOINT:-https://hello-world-agent.googleapis.com}"
  protocol: "A2A"
  
  # Connection settings
  timeout: 30000  # 30 seconds
  
  # Authentication configuration (currently none for Hello World)
  authentication:
    type: "none"
  
  # Retry configuration
  retry:
    attempts: 3
    delay: 1000      # 1 second base delay
    backoff: "exponential"  # exponential or linear
  
  # Expected capabilities (will be overridden by actual agent discovery)
  expected_capabilities:
    - "greeting"
    - "hello_world"
    - "protocol_testing"
  
  # Health check configuration
  health_check:
    enabled: true
    interval: 300000  # 5 minutes
    endpoint: "/.well-known/agent.json"

# Metadata for local registration
metadata:
  category: "external"
  provider: "Google"
  tags: ["demo", "testing", "hello-world", "a2a-protocol"]
  
  # Local override settings
  local_settings:
    log_level: "debug"
    enable_metrics: true
    enable_evaluation: true

# Local metadata (for our agent pool registration)
metadata:
  category: "demo"
  provider: "google"
  external: true
  
  # Tags for discovery and filtering
  tags:
    - "external"
    - "demo"
    - "google"
    - "hello-world"
  
  # Documentation
  documentation:
    description: "This is a proxy to Google's Hello World A2A agent for testing external agent integration"
    usage: "Use this agent to test basic A2A communication with external services"
    examples:
      - method: "hello"
        params: { "name": "World" }
        description: "Basic hello world greeting"
      - method: "greet"
        params: { "name": "Alice", "language": "en" }
        description: "Personalized greeting with language specification"

# Health check configuration (optional)
health_check:
  enabled: true
  interval: 300000  # 5 minutes
  endpoint: "/.well-known/health"
  timeout: 5000     # 5 seconds 